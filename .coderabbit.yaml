# CodeRabbit is advisory here, and it is deliberately not a required status check (the ruleset
# requires Verify, the five Images (*), Review dependency changes, Analyze and CodeQL). Its
# reviews are therefore worth having but never worth blocking on.
#
# Automatic review is off so that a PR which does not need a review does not spend one. A
# Dependabot bump or a doc-only change would otherwise take a slot from the next PR that does,
# and a slot is not recoverable for minutes to hours.
#
# The per-push cost compounds that: auto review fires on *every push*, so a PR taking four - the
# initial branch plus one commit per round of review fixes - burns four slots. Note that
# `auto_incremental_review: false` addresses only this second reason and not the first, so it is
# not a substitute for the setting below. The limit comment's "Next review available in: N
# minutes" is not a live clock either; it is rewritten only when CodeRabbit runs, so a
# rate-limited PR can look permanently blocked.
#
# Ask for the review instead, once, when the diff is finished and every required check is green:
#
#     @coderabbitai full review
#
# `.claude/skills/ship-pr/scripts/wait-coderabbit.sh` posts that ping itself and waits on the
# outcome, so do not also post one by hand.
#
# `drafts` is left at its default (false) so the same holds for draft PRs.
reviews:
  auto_review:
    enabled: false

  # Excluded from CodeRabbit's review scope, not from the pull request. The reason is the
  # per-review file cap rather than noise: a generated file that takes a place in that budget
  # costs a hand-written one its review. (The cap's exact figure per plan was not verifiable from
  # CodeRabbit's published docs.) A `!` pattern extends CodeRabbit's default ignore list rather
  # than replacing it, and a list of only `!` patterns is not read as an allowlist.
  path_filters:
    - "!**/routeTree.gen.ts"
    - "!pnpm-lock.yaml"
    - "!packages/db/drizzle/**"

  # Conventions CodeRabbit has re-raised across reviews, stated where they apply. These
  # supplement its built-in logic; they do not replace the root AGENTS.md, which it reads on its
  # own as a code-guidelines document.
  path_instructions:
    - path: "apps/*/src/routes/**"
      instructions: |
        Route data belongs in the non-lazy route file and the UI in the paired `*.lazy.tsx`. A
        route file carrying both is the finding; the split itself is not one.

        `routeTree.gen.ts` is generated by the TanStack Router plugin. Do not review it or
        suggest edits to it.
    - path: ".claude/skills/**/scripts/*.sh"
      instructions: |
        Each of these is single-purpose on purpose. They are armed independently, usually under
        separate monitors, and each documents its own outcomes and exit codes in `--help`. Do not
        suggest merging them into one entry point or factoring shared helpers across them.

        The `--help` text and the exact outcome lines are a contract: the skill's SKILL.md quotes
        them, and the fixture directories beside the scripts are how those lines are exercised
        offline. Treat a wording change to either as a behaviour change.
    - path: "**/package.json"
      instructions: |
        Which workspace may depend on which is decided by the `Boundaries` section of the root
        AGENTS.md and by the nearest nested AGENTS.md, not by general layering conventions.

        Several dependencies are held below `latest` deliberately, each with its reason recorded
        under `Dependency Ceilings` in the root AGENTS.md. Read that before flagging one as
        outdated.
