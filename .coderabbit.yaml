# CodeRabbit is advisory here, and it is deliberately not a required status check (the ruleset
# requires Verify, the five Images (*), Review dependency changes, Analyze and CodeQL). Its
# reviews are therefore worth having but never worth blocking on.
#
# Automatic review is off because it fires on *every push*, and each run consumes a per-developer
# rate-limit slot. A PR that takes four pushes - the initial branch plus one commit per round of
# review fixes - burns four slots and spends most of its life waiting on the limit rather than on
# CI. The limit comment's "Next review available in: N minutes" is not a live clock either; it is
# rewritten only when CodeRabbit runs, so a rate-limited PR can look permanently blocked.
#
# Ask for the review instead, once, when the diff is finished:
#
#     @coderabbitai review
#
# `drafts` is left at its default (false) so the same holds for draft PRs.
reviews:
  auto_review:
    enabled: false
