version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Phoenix
    open-pull-requests-limit: 5

    # Newly published versions are not proposed until they have been public for
    # 14 days. This is the primary supply-chain control: the npm account-takeover
    # incidents of the last few years were all detected and yanked well inside
    # this window. Keep this strictly greater than `minimumReleaseAge` in
    # pnpm-workspace.yaml — if Dependabot proposes a version pnpm then refuses to
    # resolve, the update fails with a confusing "no matching version" error.
    # See dependabot/dependabot-core#13165.
    cooldown:
      default-days: 14

    # Every package in the `ignore:` block below is held under `latest` on
    # purpose, each for a reason recorded in the root AGENTS.md under
    # "Dependency Ceilings". Without these rules Dependabot re-proposes each of
    # them every day, and a standing pile of PRs that must always be closed is
    # how a PR that should NOT be closed gets closed with them.
    #
    # Only the major is ignored in every case. Minor and patch keep flowing, so
    # a security fix on the current line still arrives normally — the point is
    # to suppress a known-bad jump, not to stop watching the package.
    #
    # Re-check the reason before deleting an entry; none of these are permanent.
    ignore:
      # typescript-eslint peers on `>=4.8.4 <6.1.0`. TypeScript 7 breaks lint in
      # every workspace at once. Lift when typescript-eslint widens its range.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

      # Tracks the major in `.node-version` (24), not `latest`. A newer major
      # describes APIs the runtime does not have. Lift with the runtime.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

      # No prebuilt binaries published for the 13 line, so it compiles from
      # source and the alpine image has no toolchain. See packages/db/AGENTS.md.
      # Lift when upstream ships prebuilds. Note the new `Images` CI job would
      # now catch this, so this entry is convenience rather than the guard.
      - dependency-name: better-sqlite3
        update-types: [version-update:semver-major]

      # Imported only by packages/ui chart.tsx and calendar.tsx, which no app
      # consumes and no route renders — so the real-browser check this repo
      # requires for packages/ui changes cannot be run on them at all. Upgrading
      # them is fine; upgrading them unverified is not. Lift by giving them a
      # consumer, or drop the components and these entries together.
      - dependency-name: recharts
        update-types: [version-update:semver-major]
      - dependency-name: react-day-picker
        update-types: [version-update:semver-major]

    groups:
      # Minor and patch land as one PR and are eligible for auto-merge once CI is
      # green. Majors are deliberately left ungrouped so each arrives as its own
      # PR, and dependabot-auto-merge.yml never auto-merges them.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Phoenix
    open-pull-requests-limit: 5

    # This block previously carried a comment saying `cooldown` was unsupported
    # for `github-actions` and would make Dependabot reject the whole file. That
    # was true when written and is not true now — checked against three
    # independent sources rather than one:
    #   - dependabot-core implements it: `latest_version_tag_respecting_cooldown`
    #     in github_actions/lib/dependabot/github_actions/update_checker/
    #     latest_version_finder.rb, landed in #12486 / #12502 (June 2025), feature
    #     flag removed in #12577 (July 2025).
    #   - GitHub changelog 2025-07-29, "Dependabot: Expanded cooldown and package
    #     manager support".
    #   - The options reference now lists GitHub Actions in the cooldown table.
    #
    # Only `default-days` is meaningful here. The semver-specific keys
    # (`semver-major-days` and friends) are not supported for this ecosystem, so
    # do not add them — that is the shape the old warning actually applies to.
    #
    # There was a real defect worth knowing about: for actions that release
    # frequently, cooldown checked only the newest release's date and, if that
    # failed the window, proposed nothing at all — freezing the action forever
    # (dependabot-core#13691, #14645), and it read the tag's commit date rather
    # than the release date (#13078). All three are closed as completed as of
    # June 2026. `github/codeql-action` is the dependency here that would have
    # been affected.
    #
    # Whole-file rejection on a bad key is still the failure mode, and it takes
    # the npm updates above down with it. After changing anything in this file,
    # check github.com/unimatrixcore/unimatrix-01/network/updates for a config
    # error before assuming it worked — a rejected file looks identical to a
    # quiet week.
    #
    # 7 days, not the 14 npm and docker use. The threat model is different: an
    # action bump arrives as a commit SHA change against a repository whose tags
    # and history are public and reviewable, rather than as an opaque tarball
    # from a registry account that could have been taken over. The frequent
    # releasers here — `github/codeql-action` above all — also make a long window
    # costly, since it delays every scanning-engine improvement.
    cooldown:
      default-days: 7

    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # `apps/*/Dockerfile` is generated (infra/scripts/generate-deploy-config.mjs,
  # from apps/<app>/deploy.config.ts — see packages/deploy-config/AGENTS.md),
  # except for the FROM lines a base-image bump here touches: the generator
  # reads them off the file already on disk and re-emits them verbatim rather
  # than owning them as config, specifically so a PR like this one never needs
  # a second commit syncing deploy.config.ts back to match. The generator's own
  # drift check (`check:deploy-config`) stays green through this bump for that
  # reason.
  #
  # Base images live in `apps/*/Dockerfile`, NOT in `infra/docker/`. Every
  # `infra/docker/*-compose.yaml` declares no `image:` at all — only `build:`
  # plus a Dockerfile path — and Dependabot's `docker-compose` ecosystem parses
  # only `image:` (or an inline `dockerfile_inline`), never a referenced Dockerfile.
  # A `docker-compose` block would fetch those files and find nothing, forever.
  # Do not add one.
  #
  # Dependabot's Dockerfile scan is per-directory and not recursive, so
  # `directory: /` would find nothing and each app has to be listed explicitly.
  # Keep this list in sync when an app gains or loses a Dockerfile.
  #
  # Only the `nginx` pins are actually tracked. Every
  # `FROM node:${NODE_VERSION}-alpine` is invisible to Dependabot: it performs
  # no ARG interpolation, and its tag regex cannot match a leading `$`, so the
  # line parses with no version and is skipped. That is deliberate — the Node
  # version stays owned by `.node-version` and CI's `node-version-file` rather
  # than gaining Dependabot as a second, competing owner. `apps/api` is listed
  # anyway so a future non-ARG base image there is picked up automatically.
  - package-ecosystem: docker
    directories:
      - /apps/admin
      - /apps/api
      - /apps/auth
      - /apps/cflop
      - /apps/web
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Phoenix
    open-pull-requests-limit: 5

    # Same 14 days as npm, for the same reason. Not the same as github-actions,
    # which is 7 — an action bump is a SHA change against a public, reviewable
    # repo, whereas this pulls an opaque image the same way npm pulls a tarball.
    cooldown:
      default-days: 14

    groups:
      # The same `nginx` pin repeats across every app with an nginx runtime
      # stage (`grep -l '^FROM nginx' apps/*/Dockerfile`); without grouping,
      # one bump arrives as a near-identical PR per app. It is pinned
      # `tag@sha256:`, which fixes two different timescales. Within a commit the
      # digest decides exactly which image builds, so a tag repointed upstream
      # cannot change what rebuilding that commit produces. Across commits
      # Dependabot updates tag and digest together, so the pin still tracks
      # upstream instead of freezing on this image.
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
