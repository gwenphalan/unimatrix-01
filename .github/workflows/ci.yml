name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          pnpm --filter @unimatrix/web exec playwright install --with-deps chromium
          pnpm --filter @unimatrix/cube-trainer exec playwright install --with-deps chromium

      # Runs before the expensive steps: formatting is the cheapest thing that
      # can be wrong, so failing here saves a full build/test cycle.
      - name: Format
        run: pnpm format:check

      # Also cheap, and it catches a class of problem the rest of the pipeline
      # cannot: one workspace drifting to a different version of a shared
      # dependency builds and tests green in isolation, then behaves differently
      # from its siblings at runtime.
      - name: Dependency versions
        run: pnpm deps:check

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
