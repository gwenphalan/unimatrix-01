name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# Both jobs already declare `contents: read`, so this changes nothing today. It
# is the floor for a job added later without a permissions block of its own,
# which would otherwise inherit the repository default — and it is what
# Scorecard's Token-Permissions check reads.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          pnpm --filter @unimatrix/web exec playwright install --with-deps chromium
          pnpm --filter @unimatrix/cube-trainer exec playwright install --with-deps chromium

      # Runs before the expensive steps: formatting is the cheapest thing that
      # can be wrong, so failing here saves a full build/test cycle.
      - name: Format
        run: pnpm format:check

      # Also cheap, and it catches a class of problem the rest of the pipeline
      # cannot: one workspace drifting to a different version of a shared
      # dependency builds and tests green in isolation, then behaves differently
      # from its siblings at runtime.
      - name: Dependency versions
        run: pnpm deps:check

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Last, because it is the slowest step: a real Chrome run against every
      # previewable route. `pnpm test` has already built both apps, and the
      # script resolves Playwright's Chromium itself rather than needing a
      # system Chrome or a CHROME_PATH set here.
      #
      # Reports stay on the runner. They are uploaded as a build artifact
      # below, never to an external service.
      - name: Lighthouse budgets
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: apps/*/.lighthouse/**
          retention-days: 7
          # THIS is what was broken: `include-hidden-files` defaults to false,
          # and `.lighthouse` is a dot-prefixed directory, so every report under
          # it was excluded as a hidden file. The step logged "No files were
          # found" and passed anyway on every run the workflow has ever done.
          include-hidden-files: true
          # Was `ignore`, which is what let the above look like a pass. `warn`
          # annotates a genuinely empty run — legitimate when the Lighthouse step
          # itself failed, since `always()` runs this either way — without
          # turning one failure into two.
          if-no-files-found: warn

  # `Verify` builds with Vite and tsc; it never touches a Dockerfile. That left a
  # whole class of breakage invisible: a dependency can pass every check on the
  # runner while making the deployable image unbuildable.
  #
  # Not hypothetical. `better-sqlite3@13` publishes no prebuilt binaries at all
  # (12.11.1 ships 138), so it falls through to `node-gyp rebuild` and dies on
  # `node:*-alpine` with `gyp ERR! find Python` — while `pnpm verify` stays green
  # on the glibc runner, because glibc has a prebuild. Caught by hand on
  # 2026-07-27; nothing in CI would have caught it.
  #
  # Build only, no push and no registry credentials. The point is that the image
  # still assembles, which is exactly the signal `Verify` cannot give.
  images:
    name: Images
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      # Do not cancel the other three on the first failure — knowing whether a
      # break is confined to one image or affects all of them is most of the
      # diagnosis, and re-running to find out costs another full cycle.
      fail-fast: false
      matrix:
        app: [api, auth, cube-trainer, web]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Plain `docker build` against the runner's preinstalled Docker, rather
      # than the buildx actions. It needs no third-party action to pin and no
      # cache to invalidate, and the build context is the repo itself.
      - name: Build ${{ matrix.app }} image
        run: docker build --file "apps/${{ matrix.app }}/Dockerfile" --tag "unimatrix-${{ matrix.app }}:ci" .
