name: CodeQL

# Static analysis of our own code. Findings land in the repository's Security tab,
# which is restricted to users with write access even though the repo is public —
# so nothing here publishes vulnerability details about our own code.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 15 * * *" # 08:00 America/Phoenix (UTC-7, no DST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build step: CodeQL extracts all of these directly from source, so the
      # workspace is never installed or compiled here.
      #
      # Both languages share one job deliberately — a matrix renames the job to
      # `Analyze (<language>)`, and `Analyze` is a required check that would then
      # never report, blocking every PR. Shell scripts stay uncovered either way:
      # CodeQL has no shell extractor.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          languages: javascript-typescript,actions
          queries: security-and-quality

      # `category` is a matching key, not a description — code scanning pairs a
      # PR's analysis with the same category on `main` to work out which alerts the
      # diff introduced. Changing the string breaks that pairing for one cycle:
      # dropping it here turned the required `CodeQL` check NEUTRAL with
      # "cannot determine the alerts introduced by this pull request, because 1
      # configuration present on refs/heads/main was not found". So it stays on the
      # original value even though the job now analyzes two languages.
      - name: Analyze
        uses: github/codeql-action/analyze@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          category: /language:javascript-typescript
