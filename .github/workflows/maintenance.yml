name: Daily maintenance

# The "tell me when something needs a human" job.
#
# Two distinct signals, deliberately separated:
#
#   verify — binary and trustworthy. `main` was green when it merged, so a failure
#            here means the outside world changed underneath us: a yanked package, a
#            bad transitive release, a date-dependent test. This job FAILS on that,
#            and GitHub emails the repo owner when a scheduled workflow fails. That
#            email is the notification channel — no bot, no token, no cron mailer.
#
#   knip   — advisory only, never fails the job. Unused-export detection has real
#            false positives (dynamic imports, string-keyed references, exports kept
#            deliberately as package surface), so it reports to the job summary and a
#            human decides. There is a pre-existing backlog here; gating on it would
#            make this job permanently red and destroy the signal above.

on:
  schedule:
    - cron: "0 15 * * *" # 08:00 America/Phoenix (UTC-7, no DST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify main
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          pnpm --filter @unimatrix/web exec playwright install --with-deps chromium
          pnpm --filter @unimatrix/cube-trainer exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm verify

  hygiene:
    name: Dead code report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `|| true` is load-bearing: knip exits non-zero whenever it reports anything,
      # and this job must never fail. Findings are informational.
      - name: Report unused code
        run: |
          {
            echo '## knip report'
            echo
            echo 'Advisory only — verify each finding before removing anything.'
            echo
            echo '```'
            pnpm knip --no-progress 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
