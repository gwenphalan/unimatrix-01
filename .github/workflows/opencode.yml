name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  opencode:
    # The author-association gate is a security control, not a convenience. This repo
    # is public, so without it any account on GitHub could comment "/oc" and drive an
    # agent that holds OPENROUTER_API_KEY. Keep it as the first clause.
    if: |
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      # Required, not vestigial: the action's `use_github_token` input defaults to
      # "false", so it calls core.getIDToken() to exchange an OIDC token for an
      # OpenCode App token. Removing this permission makes every /oc run fail before
      # it processes the request.
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The SHA pins the composite action wrapper, not the agent it runs. Internally
      # this action queries GitHub for the *latest* opencode release and installs it
      # with `curl -fsSL https://opencode.ai/install | bash` on every run — no
      # checksum, no version pin. So an upstream release changes the executed binary
      # without any change here. Pinning is still worth doing (it stops the wrapper
      # itself from silently changing), but do not read it as reproducibility.
      # Closing this properly means vendoring a checksummed opencode artifact.
      - name: Run opencode
        uses: anomalyco/opencode/github@02981844b88aed33f06f1527da6c58d137975069 # v1.18.7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/openai/gpt-oss-120b:free
