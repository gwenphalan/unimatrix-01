server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # This app renders no user-authored markdown and embeds nothing, so it can
  # carry a materially tighter policy than apps/web — which does render post
  # bodies and therefore has to leave more room.
  #
  # What is deliberately NOT here: default-src, script-src and connect-src.
  # Clerk loads `clerk.browser.js` from its frontend-API host and avatars from
  # img.clerk.com, and that host is a build-time value baked into the bundle by
  # Vite — a static nginx.conf cannot name it. A default-src that omitted it
  # would break sign-in on the live origin while every check in CI stayed
  # green, which is the exact failure mode this file is trying to avoid. Adding
  # them belongs with a templated conf (nginx's envsubst entrypoint) fed the
  # same build arg, not with a guess.
  #
  # frame-ancestors: clickjacking defence against a *same-site* framer.
  #   Cross-site framing already resolves signed-out (Clerk cookies are
  #   SameSite=Lax, so the frame carries no session), but a same-site frame from
  #   another *.unimatrix-01.dev origin does send cookies — and this origin holds
  #   the highest-privilege session in the family. `frame-ancestors` supersedes
  #   X-Frame-Options and the two can conflict, so only this directive is set.
  # base-uri 'none': a <base> tag is one injected element away from repointing
  #   every relative URL in the document. No Vite build emits one.
  # object-src 'none': no plugin content, ever.
  # form-action 'self': nothing here posts a form off-origin. Clerk's SSO leaves
  #   by window.location, which this directive does not govern.
  #
  # `always` so the headers are present on error responses (404/50x) too, not
  # just 2xx/3xx.
  add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  # The admin origin's paths are operator-facing. Send the origin only, so a
  # cross-origin request never leaks which console screen the operator was on.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /50x.html {
    internal;
  }
}
