server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;

  # Clickjacking defence against a *same-site* framer. Cross-site framing already
  # resolves signed-out (Clerk cookies are SameSite=Lax, so the frame carries no
  # session), but a same-site frame from another *.unimatrix-01.dev origin does
  # send cookies — and admin.unimatrix-01.dev is planned. `frame-ancestors`
  # supersedes X-Frame-Options, so only this directive is set: the two can
  # conflict. Deliberately no default-src/script-src — a full CSP would break
  # Clerk and the Vite-built bundles. `always` so the headers are also present on
  # error responses (404/50x), not just 2xx/3xx.
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;

  # No SPA fallback. The build writes one HTML file per route, so an unknown
  # path is a real 404 instead of the home shell answering at 200 and the client
  # router turning it into a not-found card — a soft 404 nothing outside the
  # browser can tell from a page.
  #
  # `absolute_redirect off` or `Location` names the container-internal port
  # (`http://cflop.unimatrix-01.dev:8080/...`) behind Traefik.
  absolute_redirect off;

  location = /404.html { internal; }
  location = /50x.html { internal; }
  location = /index.html { return 301 /; }

  # The extensionless twins of the two prerendered files that are not routes.
  # A route added later needs no change here; these two never need touching.
  location = /404 { return 404; }
  location = /index { return 404; }

  # Deliberately `location` blocks and not a server-level `rewrite`. A rewrite
  # re-fires on the internal redirect `try_files` issues for a directory, which
  # loops `/assets` forever. Exact-match locations beat regex ones, which is
  # also what keeps `error_page`'s internal redirect to `/404.html` out of the
  # `.html` rule below.
  location ~ ^(/.+)/$ { return 301 $1$is_args$args; }
  location ~ ^(/.+)\.html$ { return 301 $1$is_args$args; }

  location = / { try_files /index.html =404; }
  location / { try_files $uri $uri.html =404; }

  error_page 404 /404.html;
}
