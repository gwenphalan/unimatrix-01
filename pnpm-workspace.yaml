packages:
  - apps/*
  - packages/*

# Lifecycle scripts are blocked for every dependency except the two below, which
# genuinely need a native build step. This is pnpm 10's default-deny behaviour —
# it is the `--ignore-scripts` + allowlist policy, enforced by the package
# manager rather than bolted on at the CI layer.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# Minutes a version must have been public before pnpm will resolve it. Dependabot's
# 14-day `cooldown` only gates the *direct* dependency it proposes; the transitive
# graph is resolved by pnpm, so without this a compromised transitive release could
# still enter the lockfile the moment it is published. Renovate has the same
# limitation ("Renovate does not currently manage any transitive dependencies") and
# its `--before` mitigation is npm-only, so this setting — not the choice of bot —
# is what actually closes the transitive gap.
#
# 3 days, deliberately well below Dependabot's 14, so the two never disagree about
# which version is installable. Raising this above 14 will break Dependabot PRs.
#
# Requires pnpm >= 10.16; this repo pins 10.30.3. Verified working on 10.30.3 rather
# than assumed: with `minimumReleaseAge: 525600` a scratch workspace resolved
# `typescript@5.8.3`, while the same install with the setting removed resolved
# `typescript@7.0.2`. Some guidance says pnpm 10 reads this only from `.npmrc` — that
# is not true of 10.30.3, which honours it here. If the pin ever drops below 10.16
# this silently becomes a no-op.
minimumReleaseAge: 4320

# `@vitest/coverage-v8` reaches `brace-expansion@2.1.2` through
# `test-exclude` -> `glob@10` -> `minimatch@9`, which carries
# GHSA-mh99-v99m-4gvg (high) — the same advisory the ESLint 9 -> 10 upgrade
# removed from this tree. `Review dependency changes` fails on it, correctly.
#
# The advisory has no patched release below `brace-expansion@5.0.8`, and 5.0.8
# cannot simply be substituted: it exports a named `{ expand }` with no
# default, while `minimatch@9` does `import expand from "brace-expansion"`.
# Overriding `brace-expansion` itself leaves `expand` undefined at runtime.
#
# Overriding `minimatch@9` works because `minimatch@10` still exports
# everything `glob@10` imports from it — `escape`, `unescape`, `Minimatch`,
# `GLOBSTAR` — and depends on the patched `brace-expansion@5.0.8`.
#
# This is load-bearing, not leftover cruft. Remove it and the dependency
# review turns red again with no explanation of why.
overrides:
  minimatch@9: ^10.2.5

  # `drizzle-kit` declares `@esbuild-kit/esm-loader`, which pulls in
  # `@esbuild-kit/core-utils` and through it `esbuild@0.18.20`, carrying
  # GHSA-67mh-4wv8-2f99 (moderate): esbuild's dev server accepts requests from
  # any origin. There is no upstream fix at any age — `drizzle-kit@0.31.10` is
  # the latest release (2026-03-17) and still declares the dependency, and both
  # `@esbuild-kit` packages are deprecated, having been folded into `tsx`.
  #
  # Overriding is safe here for a specific, checked reason rather than a hopeful
  # one: `@esbuild-kit` is referenced *only* in drizzle-kit's own package.json.
  # Grepping its shipped code — api.js, api.mjs, bin.cjs, utils.js, utils.mjs,
  # roughly 2.8 MB of bundles — finds zero occurrences of `esbuild-kit` or
  # `esm-loader`. drizzle-kit bundles its own tooling and depends on `tsx`
  # directly; the `@esbuild-kit` entry is vestigial and nothing loads it.
  #
  # That cuts both ways, and is why this comment exists: because the package is
  # never loaded, a genuine incompatibility introduced by this override would not
  # surface as a failing test. The justification is the reachability check above,
  # not a green build.
  #
  # The advisory itself is also unreachable — it affects `esbuild serve`, which
  # drizzle-kit never invokes. The override is about keeping `pnpm audit` at a
  # real zero so the next moderate finding stands out, rather than about
  # closing an exploitable hole.
  #
  # Remove this once drizzle-kit drops the vestigial dependency.
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
